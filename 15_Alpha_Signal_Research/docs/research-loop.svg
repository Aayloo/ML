<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Alpha Signal Research loop</title>
  <desc id="desc">A research workflow from market data to robust investment conclusions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#56708f"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #b8cbe2; stroke-width: 2; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #17324d; text-anchor: middle; }
      .small { font: 13px 'Segoe UI', Arial, sans-serif; fill: #56708f; text-anchor: middle; }
      .arrow { stroke: #56708f; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Alpha Signal Research Loop</text>
  <g transform="translate(35,82)">
    <rect class="box" width="140" height="90" rx="14"/>
    <text class="label" x="70" y="38">Market data</text><text class="small" x="70" y="64">universe · labels</text>
  </g>
  <g transform="translate(225,82)">
    <rect class="box" width="140" height="90" rx="14"/>
    <text class="label" x="70" y="38">Features</text><text class="small" x="70" y="64">lagged · clean</text>
  </g>
  <g transform="translate(415,82)">
    <rect class="box" width="140" height="90" rx="14"/>
    <text class="label" x="70" y="38">Alpha signal</text><text class="small" x="70" y="64">rank · IC</text>
  </g>
  <g transform="translate(605,82)">
    <rect class="box" width="140" height="90" rx="14"/>
    <text class="label" x="70" y="38">Walk-forward</text><text class="small" x="70" y="64">out-of-sample</text>
  </g>
  <g transform="translate(795,82)">
    <rect class="box" width="140" height="90" rx="14"/>
    <text class="label" x="70" y="38">Portfolio</text><text class="small" x="70" y="64">weights · costs</text>
  </g>
  <g transform="translate(985,82)">
    <rect class="box" width="140" height="90" rx="14"/>
    <text class="label" x="70" y="38">Conclusion</text><text class="small" x="70" y="64">risk · limits</text>
  </g>
  <line class="arrow" x1="177" y1="127" x2="220" y2="127"/>
  <line class="arrow" x1="367" y1="127" x2="410" y2="127"/>
  <line class="arrow" x1="557" y1="127" x2="600" y2="127"/>
  <line class="arrow" x1="747" y1="127" x2="790" y2="127"/>
  <line class="arrow" x1="937" y1="127" x2="980" y2="127"/>
  <path d="M1055 180 C1055 225 105 225 105 180" fill="none" class="arrow"/>
  <text x="600" y="222" class="small">iterate only on the development/validation process; keep the final test period untouched</text>
</svg>
